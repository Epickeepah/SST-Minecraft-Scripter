<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SST Maps</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fcfafa;
            color: #faf6f6;
            display: grid;
            place-items: center;
        }

        main {
            width: min(720px, calc(100% - 32px));
            padding: 42px 0;
        }

        h1 {
            margin: 0;
            color: rgb(12, 12, 12);
            font-size: clamp(2.3rem, 7vw, 4.5rem);
            letter-spacing: -.06em;
        }

        .intro {
            color: #aeb9c9;
            margin: 12px 0 28px;
            font-size: 1.1rem;
        }

        form,
        .result {
            background: #504f4f;
            border: 1px solid #504f4f;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 60px #504f4f;
        }

        .top-frame {
            position: absolute;
            left: 0px;
            right: 0px;
            top: 0px;

            width: 100vw;
            height: 125px;
            border-radius: 0px;

        }

        .side-frame {
            position: absolute;
            left: 0px;
            top: 170px;
            bottom: 0px;

            width: 150px;
            height: 100vh;
            border-radius: 0px;
        }

        .Logo {
            top: 0px;
            left: 0px;
            width: 150px;
            height: 150px;
        }

        .SST {
            position: absolute;
            left: 200px;
            top: 40px;
            color: white;
            font-size: 48px;

        }

        .MBD {
                        position: absolute;
            left: 200px;
            top: 80px;
            color: white;
            font-size: 20px;
        }

        .white {
            color: white;
        }

        .red {
            color: red;
        }

        .Version {
            position: absolute;
            top: 0px;
            right: 70px;

            color: white;
            z-index: 30;
        }

.main-dropdown {
    position: absolute;
    left: 10px;
    top: 35%;

    width: 150px;
    height: 40px;

    font-size: 16px;
}

.main-dropdown {
    position: absolute;
    left: 10px;
    top: 20%;
    width: 150px;
}

.dropdown-button {
    width: 150px;
    height: 40px;
    font-size: 16px;
}

.dropdown-content {
    display: none;
    position: absolute;
    width: 150px;
    background: #333;
}

.main-dropdown:hover .dropdown-content {
    display: block;
}

.dropdown-item {
    position: relative;
    padding: 10px;
    color: white;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #555;
}

.submenu {
    display: none;
    position: absolute;
    left: 100%;
    top: 0;
    width: 180px;
    background: #333;
}

.dropdown-item:hover .submenu {
    display: block;
}

.submenu a,
.dropdown-content > a {
    display: block;
    padding: 10px;
    color: white;
    text-decoration: none;
}

.submenu a:hover,
.dropdown-content > a:hover {
    background: #555;
}

    </style>
</head>


<body>
    <main>
        <form class="top-frame">
            <img src="images/logo.PNG" alt="Logo" class="Logo">
            <h1 class="SST">SST</h1>
            <p class="MBD">Minecraft Bedrock Scripter</p>
            <h2 class="Version" id="version-text"></h2>
        </form>
        <form class="side-frame">
<div class="main-dropdown">
    <button class="dropdown-button">Tools ▼</button>

    <div class="dropdown-content">

        <div class="dropdown-item">
            Sound Scripter ▶

            <div class="submenu">
                <a href="#">Create Sound Script</a>
                <a href="#">Add To Sound Script</a>
            </div>
        </div>

        <div class="dropdown-item">
            Texture Scripter ▶

            <div class="submenu">
                <a href="#">Create Texture Script</a>
                <a href="#">Add To Texture Script</a>
            </div>
        </div>

    </div>
</div>
        </form>
    </main>
    <script src="config.js"></script>

    <script>
        document.getElementById("version-text").textContent = web_version;
    </script>
</body>


</html>
