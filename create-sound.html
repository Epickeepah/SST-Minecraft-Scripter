<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SST Sound Creation</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;

        background: #fcfafa;
        color: #faf6f6;

        overflow: hidden;
      }
      main {
        width: min(720px, calc(100% - 32px));
        padding: 42px 0;
      }

      h1 {
        margin: 0;
        color: rgb(12, 12, 12);
        font-size: clamp(2.3rem, 7vw, 4.5rem);
        letter-spacing: -0.06em;
      }

      .intro {
        color: #aeb9c9;
        margin: 12px 0 28px;
        font-size: 1.1rem;
      }

      form,
      .result {
        background: #504f4f;
        border: 1px solid #504f4f;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 60px #504f4f;
      }

      .top-frame {
        position: fixed;
        left: 0;
        top: 0;

        width: 100vw;
        height: 125px;

        border-radius: 0;
        background: #504f4f;

        z-index: 200;
      }

      .side-frame {
        position: fixed;
        left: 0;
        top: 125px;

        width: 220px;
        height: calc(100vh - 125px);

        background: #504f4f;

        border: none;
        border-radius: 0;
        padding: 0;
        margin: 0;

        box-shadow: none;
        box-sizing: border-box;

        z-index: 100;
      }

      .Logo {
        top: 0px;
        left: 0px;
        width: 150px;
        height: 150px;
      }

      .SST {
        position: absolute;
        left: 150px;
        top: 20px;
        color: white;
        font-size: 48px;
      }

      .MBD {
        position: absolute;
        left: 150px;
        top: 50px;
        color: white;
        font-size: 20px;
      }

      .white {
        color: white;
      }

      .red {
        color: red;
      }

      .Version {
        position: absolute;
        top: 0px;
        right: 70px;

        color: white;
        z-index: 30;
      }

      .main-dropdown {
        position: absolute;
        left: 15px;
        top: 20%;
        width: 220px;
      }

      .dropdown-button {
        width: 180px;
        height: 40px;
        font-size: 16px;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        width: 220px;
        background: #333;
        z-index: 101;
      }

      .main-dropdown:hover .dropdown-content {
        display: block;
      }

      .dropdown-item {
        position: relative;
        width: 220px;
        padding: 10px;
        color: white;
        cursor: pointer;
        box-sizing: border-box;
      }

      .dropdown-item:hover {
        background: #555;
      }

      .submenu {
        display: none;
        position: absolute;
        left: 220px;
        top: 0;
        width: 220px;
        background: #333;
        z-index: 102;
      }

      .dropdown-item:hover .submenu {
        display: block;
      }

      .submenu a,
      .dropdown-content > a {
        display: block;
        width: 220px;
        padding: 10px;
        box-sizing: border-box;
        color: white;
        text-decoration: none;
      }

      .submenu a:hover,
      .dropdown-content > a:hover {
        background: #555;
      }

      .content-area {
        position: fixed;

        left: 220px;
        top: 125px;

        width: calc(100vw - 220px);
        height: calc(100vh - 125px);

        background: #fcfafa;
        color: black;

        box-sizing: border-box;
        padding: 30px;

        z-index: 1;

        overflow-y: auto;
        overflow-x: hidden;
      }

      .content-area-frame {
        position: fixed;
        left: 220px;
        top: 150px;
        bottom: 0;
        padding: 50px;

        width: calc(100vw - 220px);
        height: calc(100vh - 125px);

        background: lightgray;
        color: white;

        box-sizing: border-box;
        padding: 30px;

        z-index: 1;

        overflow-y: auto;
        overflow-x: hidden;
      }

      .content-area-inside {
        position: fixed;
        left: 220px;
        top: 150px;
        bottom: 0;
        padding: 50px;

        width: calc(100vw - 220px);
        height: calc(100vh - 125px);

        background: white;
        color: white;

        box-sizing: border-box;
        padding: 30px;

        z-index: 1;

        overflow-y: auto;
        overflow-x: hidden;
      }

      .content-inside {
        position: fixed;
        left: 20%;
        right: 10%;
        top: 20%;
        bottom: 0;
        padding: 50px;

        background: #1e1e1e;
        color: white;

        border: 1px solid #444;
        border-radius: 10px;

        padding: 15px;
        box-sizing: border-box;

        overflow-y: auto;

        font-family: Consolas, monospace;
        font-size: 14px;
      }

      .text-box {
        width: 400px;
        height: 40px;
        padding: 10px;
        font-size: 16px;
        box-sizing: border-box;
        background-color: white;
        border: 2px solid #ccc;
        border-radius: 20px;
        outline: none;
      }

      .text-box:focus {
        border-color: red;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      }

      .text-box-group {
        width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .text-box-group h3 {
        color: white;
        font-size: 30px;
        margin: 0;
      }

      .spacing-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .spacing-content h3 {
        color: white;
        font-size: 30px;
        margin: 10px 0 20px;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- TOP FRAME -->
      <div class="top-frame">
        <img src="images/logo.PNG" alt="Logo" class="Logo" />

        <h1 class="SST">SST</h1>

        <p class="MBD">Minecraft Bedrock Scripter</p>

        <h2 class="Version" id="version-text"></h2>
      </div>

      <!-- SIDE FRAME -->
      <div class="side-frame">
        <div class="main-dropdown">
          <button class="dropdown-button">Tools ▼</button>

          <div class="dropdown-content">
            <div class="dropdown-item">
              Main Menu ▶

              <div class="submenu">
                <a href="index.html">Main Menu</a>
                <a href="#">Info Menu</a>
              </div>
            </div>

            <div class="dropdown-item">
              Sound Scripter ▶

              <div class="submenu">
                <a href="create-sound.html">Create Sound Script</a>
                <a href="#">Add To Sound Script</a>
                <a href="#">Intro to Sound Scripts</a>
              </div>
            </div>

            <div class="dropdown-item">
              Texture Scripter ▶

              <div class="submenu">
                <a href="#">Create Texture Script</a>
                <a href="#">Add To Texture Script</a>
                <a href="#">Intro to Texture Scripts</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="content-area" id="content-area">
        <div class="content-area-frame">
          <div class="content-inside">
            <h2 style="color: white">Create Sound Addon</h2>
            <div class="spacing-content">
              <div class="text-box-group">
                <h3>Manifest</h3>
                <input class="text-box" type="text" placeholder="Pack Name" />
              </div>

              <div class="text-box-group">
                <h3>Description</h3>
                <input
                  class="text-box"
                  type="text"
                  placeholder="Pack Description"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="config.js"></script>

    <script>
      document.getElementById("version-text").textContent = web_version;
    </script>
  </body>
</html>
